<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offline OCR PDF Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Secure Offline OCR PDF Converter</h1>

        <p>
            All document processing occurs locally.
            No data is uploaded online.
        </p>

        <!-- PDF Upload -->
        <input
            type="file"
            id="pdfFile"
            accept=".pdf"
        >

        <button onclick="convertPDF()">
            Convert to DOCX
        </button>

        <p id="status"></p>

        <hr>

        <!-- CHAT SECTION -->
        <h2>Ask Questions About PDF</h2>

        <input
            type="text"
            id="questionInput"
            placeholder="Ask something about the PDF..."
        >

        <button onclick="askQuestion()">
            Ask
        </button>

        <div id="answerBox"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
